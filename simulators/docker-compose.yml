services:
  device_agent:
    image: spaneng/doover_device_agent:apps
    network_mode: host

  platform_iface:
    image: spaneng/doover_platform_iface
    network_mode: host
    entrypoint: python3 -u platform_iface.py --type=sim

  location_manager:
    build: ../
    restart: unless-stopped
    network_mode: host
    depends_on:
      - device_agent
      - platform_iface
